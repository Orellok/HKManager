name: CI

on:
  # Branches only: a tag (even one named "main") must not start CI and, through it, the
  # staging migrations.
  # Actions minutes budget (owner hit the 2000-minute Free limit, 2026-11-23): CI runs on
  # main and on pull requests only, not on every push to working branches. Every push to
  # main still runs CI (no path filter there): the staging migrations and deploy chain
  # starts from CI on main and deploys only the head of main.
  push:
    branches: ["main"]
  # Documentation-only pull requests need no checks.
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

# A newer commit on a pull request makes the older run useless, so it is cancelled. Each push
# gets its own group (the run id) and is never cancelled or replaced: the staging migrations
# workflow waits for each commit's CI result on main.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned in package.json ("packageManager").
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Uses the CLI's default image registry.
      - name: Start the local Supabase stack
        run: pnpm db:start

      - name: Integration tests
        run: pnpm test:integration

      # A build without Supabase values, as for any environment. The E2E webServer rebuilds the
      # app with the local stack's public URL and anon key; building twice is intentional.
      - name: Build
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e --trace off
