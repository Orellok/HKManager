name: Staging migrations

# Runs only after CI succeeded for a push to main, and applies that exact commit's
# supabase/migrations to the staging project (SPEC section 0 rule 5: staging before production).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# The production workflow finds the staging run for a commit by this title. Keep the format
# in sync with the guard in production-migrations.yml.
run-name: Staging migrations ${{ github.event.workflow_run.head_sha }}

permissions:
  contents: read

# Runs never overlap; a newer queued run replaces an older queued one.
concurrency:
  group: supabase-migrations-staging
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: tmistmqyqcnjftovxyoy

jobs:
  # A separate job, so that a superseded commit leaves the migrate job "skipped" rather than
  # "success": the production guard counts only a migrate job that succeeded.
  check-head:
    name: Check that the commit is still the head of main
    # Only a successful CI run for a push to this repository's main branch. A pull request
    # whose head branch happens to be called "main" (for example from a fork) does not count.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is-head: ${{ steps.head.outputs.is-head }}
    steps:
      # If main has moved on, the newer commit's own run applies every pending migration.
      # Applying an older commit after a newer one would fail on the migration history.
      - name: Compare the commit with the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main_sha" = "$COMMIT_SHA" ]; then
            echo "is-head=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping: $COMMIT_SHA is no longer the head of main ($main_sha); that commit's run applies the migrations."
            echo "is-head=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    # The production guard matches this exact job name.
    name: Apply migrations to staging
    needs: check-head
    if: needs.check-head.outputs.is-head == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check that the secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The SUPABASE_ACCESS_TOKEN secret is not set (docs/setup/github-secrets.md)"
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::The SUPABASE_STAGING_DB_PASSWORD secret is not set (docs/setup/github-secrets.md)"
            missing=1
          fi
          exit "$missing"

      - name: Check out the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # The Supabase CLI is a devDependency, so CI and migrations use the same CLI version.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link the staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Applies only the pending files in supabase/migrations. It does not push the auth
      # settings in supabase/config.toml (docs/setup/supabase-auth.md) and does not run the seed.
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: pnpm exec supabase db push --remote --yes

      # M7.2 (NOTIF-14, 16): the push Edge Function, bundled server-side (no Docker). It checks
      # both of its callers itself, so the gateway's JWT check is off (supabase/config.toml).
      # Its VAPID secrets are set once by the owner (docs/setup/push.md).
      - name: Deploy the push Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase functions deploy push --use-api --no-verify-jwt --yes

      # Points the daily pg_cron job at this project's function (the URL is not secret; the
      # cron secret was generated by the migration). The query's output is discarded.
      - name: Point the daily push reminders at the function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: >-
          pnpm exec supabase db query --remote --yes
          "select public.configure_push_reminders('https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/push')"
          > /dev/null
