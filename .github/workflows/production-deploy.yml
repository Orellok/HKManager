name: Production deploy

# Manual only. Deploys a commit on main to the production Netlify site (M0.6), and only when
# that commit's staging deploy succeeded and its production migrations were applied
# (SPEC section 0 rule 5: staging before production; schema before the code that uses it).
on:
  workflow_dispatch:

run-name: Production deploy ${{ github.sha }}

permissions:
  contents: read

# Deploys never overlap; a newer queued run replaces an older queued one.
concurrency:
  group: netlify-deploy-production
  cancel-in-progress: false

# bash -eo pipefail: a failing command anywhere in a pipeline fails the step.
defaults:
  run:
    shell: bash

env:
  NETLIFY_CLI_VERSION: 27.20.1
  NETLIFY_TELEMETRY_DISABLED: "true"
  # The production Supabase project (docs/setup/environments.md). The public URL variable must
  # point here, so the production site can never be built against staging.
  EXPECTED_SUPABASE_URL: https://gnjdyiujvxbwhxmldgfn.supabase.co

jobs:
  guard:
    name: Require a successful staging deploy and production migrations for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys run only from main (this run is for $GITHUB_REF)"
          exit 1

      # Each workflow names its runs "<name> <commit SHA>" (its run-name). A run can conclude
      # "success" while the job that matters was skipped, so that job itself must have
      # succeeded. Any API error fails this step.
      - name: Require a successful staging deploy and production migrations for this commit
        run: |
          # API errors inside $(...) fail the step too.
          shopt -s inherit_errexit
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected commit SHA: $COMMIT_SHA"
            exit 1
          fi
          # Prints the URL of the first job named $4 that succeeded in a successful run of
          # workflow file $1 (event $2) titled "$3 <commit SHA>"; prints nothing otherwise.
          find_successful_job() {
            local workflow_file="$1" event="$2" title="$3 $COMMIT_SHA" job_name="$4" run_ids run_id jobs
            run_ids=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?event=$event&branch=main&status=success&per_page=100" \
              --jq ".workflow_runs[] | select(.display_title == \"$title\" and .conclusion == \"success\") | .id")
            for run_id in $run_ids; do
              jobs=$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
                --jq ".jobs[] | select(.name == \"$job_name\" and .conclusion == \"success\") | .html_url")
              if [ -n "$jobs" ]; then
                head -n 1 <<<"$jobs"
                return 0
              fi
            done
          }
          failed=0
          # Names of the runs and jobs in staging-deploy.yml and production-migrations.yml;
          # keep them in sync.
          staging_deploy=$(find_successful_job staging-deploy.yml workflow_run "Staging deploy" "Deploy to staging")
          if [ -n "$staging_deploy" ]; then
            echo "Staging deploy succeeded for $COMMIT_SHA: $staging_deploy"
          else
            echo "::error::No successful staging deploy for $COMMIT_SHA. Run this workflow from the head of main once CI, the staging migrations and the staging deploy have passed for it."
            failed=1
          fi
          production_migrations=$(find_successful_job production-migrations.yml workflow_dispatch "Production migrations" "Apply migrations to production")
          if [ -n "$production_migrations" ]; then
            echo "Production migrations succeeded for $COMMIT_SHA: $production_migrations"
          else
            echo "::error::No successful production migrations run for $COMMIT_SHA. Run the Production migrations workflow from main first (it applies nothing when no migration is pending), then this one."
            failed=1
          fi
          exit "$failed"

  deploy:
    name: Deploy to production
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMIT_SHA: ${{ github.sha }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_PRODUCTION_SITE_ID }}
      # Unique per run attempt; used to find this deploy through the Netlify API.
      DEPLOY_MESSAGE: GitHub Actions run ${{ github.run_id }}.${{ github.run_attempt }} for ${{ github.sha }}
    steps:
      # Prints only the names of missing or wrong settings, never their values.
      - name: Check the deploy settings
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.PRODUCTION_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          failed=0
          fail() {
            echo "::error::$1 (docs/setup/deploy.md)"
            failed=1
          }
          [ -n "$NETLIFY_AUTH_TOKEN" ] || fail "The NETLIFY_AUTH_TOKEN secret is not set"
          if [ -z "$NETLIFY_SITE_ID" ]; then
            fail "The NETLIFY_PRODUCTION_SITE_ID variable is not set"
          elif ! [[ "$NETLIFY_SITE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            fail "The NETLIFY_PRODUCTION_SITE_ID variable is not a Netlify Site ID"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            fail "The PRODUCTION_NEXT_PUBLIC_SUPABASE_URL variable is not set"
          elif [ "$NEXT_PUBLIC_SUPABASE_URL" != "$EXPECTED_SUPABASE_URL" ]; then
            fail "The PRODUCTION_NEXT_PUBLIC_SUPABASE_URL variable must be $EXPECTED_SUPABASE_URL"
          fi
          # The key is built into the browser bundle, so it must be the public (anon or
          # publishable) key. A service role or secret key here would be published.
          key="$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          if [ -z "$key" ]; then
            fail "The PRODUCTION_NEXT_PUBLIC_SUPABASE_ANON_KEY variable is not set"
          elif [[ "$key" != sb_publishable_* ]]; then
            payload=""
            if [[ "$key" =~ ^[A-Za-z0-9_-]+\.([A-Za-z0-9_-]+)\.[A-Za-z0-9_-]+$ ]]; then
              payload=$(printf '%s' "${BASH_REMATCH[1]}" | tr '_-' '/+')
              while (( ${#payload} % 4 )); do payload+="="; done
            fi
            role=$(printf '%s' "$payload" | base64 --decode 2>/dev/null | jq -r '.role // empty' 2>/dev/null || true)
            [ "$role" = "anon" ] || fail "The PRODUCTION_NEXT_PUBLIC_SUPABASE_ANON_KEY variable is not a public anon or publishable key"
          fi
          exit "$failed"

      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds with netlify.toml (pnpm build + the Next.js runtime) and uploads a draft deploy;
      # the live site does not change until the smoke checks pass. The public Supabase values
      # are built into the app. The CLI's build and deploy run in one process (the runtime's
      # output exists only between them), so the token is present during the build.
      - name: Build and upload a draft deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.PRODUCTION_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: >-
          npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" deploy
          --site "$NETLIFY_SITE_ID" --message "$DEPLOY_MESSAGE"

      - name: Find the draft deploy
        id: draft
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          deploys=$(npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" api listSiteDeploys \
            --data "$(jq -cn --arg site_id "$NETLIFY_SITE_ID" '{site_id: $site_id, per_page: 20}')")
          matches=$(jq -c --arg title "$DEPLOY_MESSAGE" \
            '[.[] | select(.title == $title and .state == "ready") | {id, url: .deploy_ssl_url}]' <<<"$deploys")
          if [ "$(jq length <<<"$matches")" != "1" ]; then
            echo "::error::Expected exactly one ready deploy titled \"$DEPLOY_MESSAGE\""
            exit 1
          fi
          deploy_id=$(jq -r '.[0].id' <<<"$matches")
          deploy_url=$(jq -r '.[0].url' <<<"$matches")
          if ! [[ "$deploy_id" =~ ^[0-9a-f]{24}$ && "$deploy_url" =~ ^https://[0-9a-f]{24}--[a-z0-9-]+\.netlify\.app$ ]]; then
            echo "::error::Unexpected deploy id or URL from the Netlify API"
            exit 1
          fi
          echo "Draft deploy $deploy_id: $deploy_url"
          echo "deploy-id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "deploy-url=$deploy_url" >> "$GITHUB_OUTPUT"

      # VERIFY-02 gate: proves on the real host that src/proxy.ts runs (login redirect, nonce
      # CSP, prefetch protection) and that indexing is blocked. A failure leaves the live site
      # unchanged.
      - name: Smoke check the draft deploy
        env:
          DEPLOY_URL: ${{ steps.draft.outputs.deploy-url }}
        run: node scripts/smoke-deploy.mts "$DEPLOY_URL"

      - name: Publish the deploy to the production site
        id: publish
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          DEPLOY_ID: ${{ steps.draft.outputs.deploy-id }}
        run: |
          npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" api restoreSiteDeploy \
            --data "$(jq -cn --arg site_id "$NETLIFY_SITE_ID" --arg deploy_id "$DEPLOY_ID" \
              '{site_id: $site_id, deploy_id: $deploy_id}')" > /dev/null
          site_url=$(npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" api getSite \
            --data "$(jq -cn --arg site_id "$NETLIFY_SITE_ID" '{site_id: $site_id}')" | jq -r .ssl_url)
          if ! [[ "$site_url" =~ ^https://[a-z0-9.-]+$ ]]; then
            echo "::error::Unexpected site URL from the Netlify API"
            exit 1
          fi
          echo "Published deploy $DEPLOY_ID to $site_url"
          echo "site-url=$site_url" >> "$GITHUB_OUTPUT"

      - name: Smoke check the live production site
        env:
          SITE_URL: ${{ steps.publish.outputs.site-url }}
        run: node scripts/smoke-deploy.mts "$SITE_URL"
