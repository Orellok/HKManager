name: Production migrations

# Manual only. Applies supabase/migrations to production, and only for a commit on main whose
# staging migrations run succeeded (SPEC section 0 rule 5: staging before production).
on:
  workflow_dispatch:

run-name: Production migrations ${{ github.sha }}

permissions:
  contents: read

# Runs never overlap; a newer queued run replaces an older queued one.
concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: gnjdyiujvxbwhxmldgfn

jobs:
  staging-guard:
    name: Require a successful staging run for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT_SHA: ${{ github.sha }}
      STAGING_WORKFLOW_FILE: staging-migrations.yml
      # The name of the migrate job in staging-migrations.yml; keep the two in sync.
      STAGING_MIGRATE_JOB_NAME: Apply migrations to staging
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production migrations run only from main (this run is for $GITHUB_REF)"
          exit 1

      # The staging workflow names each run "Staging migrations <commit SHA>" (its run-name).
      # A run can conclude "success" while its migrate job was skipped (for example when CI
      # failed, or when main had already moved on), so the migrate job itself must have
      # succeeded. Any API error fails this step.
      - name: Require a successful staging migrations run for this commit
        run: |
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected commit SHA: $COMMIT_SHA"
            exit 1
          fi
          expected_title="Staging migrations $COMMIT_SHA"
          candidate_runs=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$STAGING_WORKFLOW_FILE/runs?event=workflow_run&branch=main&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.display_title == \"$expected_title\" and .conclusion == \"success\") | .id")
          for run_id in $candidate_runs; do
            migrate_jobs=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"$STAGING_MIGRATE_JOB_NAME\" and .conclusion == \"success\") | .html_url")
            if [ -n "$migrate_jobs" ]; then
              echo "Staging migrations succeeded for $COMMIT_SHA:"
              echo "$migrate_jobs"
              exit 0
            fi
          done
          echo "::error::No successful staging migrations run for $COMMIT_SHA. Run this workflow from the head of main once CI and the staging migrations have passed for it."
          exit 1

  migrate:
    name: Apply migrations to production
    needs: staging-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check that the secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The SUPABASE_ACCESS_TOKEN secret is not set (docs/setup/github-secrets.md)"
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::The SUPABASE_PROD_DB_PASSWORD secret is not set (docs/setup/github-secrets.md)"
            missing=1
          fi
          exit "$missing"

      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The Supabase CLI is a devDependency, so CI and migrations use the same CLI version.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Applies only the pending files in supabase/migrations. It does not push the auth
      # settings in supabase/config.toml (docs/setup/supabase-auth.md) and does not run the seed.
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: pnpm exec supabase db push --remote --yes
